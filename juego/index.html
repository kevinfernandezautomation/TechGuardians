{id:'QA GUARDIANS',kind:'qa',color:'#67f0ae',sub:['Aplica principios de pruebas ISTQB','Apply ISTQB testing principles'],q:['Según ISTQB, ¿las pruebas exhaustivas son posibles en la mayoría de sistemas reales?','According to ISTQB, is exhaustive testing feasible for most real-world systems?'],a:[['Sí, siempre','No; se prioriza según riesgo','Solo si hay automatización'],['Yes, always','No; prioritize based on risk','Only with automation']],correct:1,why:['ISTQB: las pruebas exhaustivas son imposibles salvo casos triviales.','ISTQB: exhaustive testing is impossible except in trivial cases.']},

{id:'DEVOPS GUARDIANS',kind:'devops',color:'#65f5e1',sub:['Recupera una canalización CI/CD','Recover a CI/CD pipeline'],q:['Un despliegue falla después de las pruebas. ¿Qué acción reduce el riesgo?','A deployment fails after testing. Which action reduces risk?'],a:[['Ignorar las alertas','Analizar logs y aplicar rollback controlado','Publicar directamente en producción'],['Ignore alerts','Inspect logs and perform a controlled rollback','Deploy directly to production']],correct:1,why:['Un rollback controlado y la evidencia ayudan a recuperar el servicio.','A controlled rollback and evidence help restore service.']},
